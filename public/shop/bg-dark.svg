<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <!-- 임시 플레이스홀더: 실제 배경 에셋으로 교체 예정 -->
  <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dark)"/>
  <text x="320" y="190" font-family="sans-serif" font-size="28" fill="#ffffff" fill-opacity="0.65" text-anchor="middle">다크</text>
</svg>
